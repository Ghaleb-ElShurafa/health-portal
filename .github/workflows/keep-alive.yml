name: Keep Render app awake

# Render's free tier spins the app down after 15 minutes with no incoming
# requests, causing a 30-60s cold start on the next visit. Pinging every 5
# minutes keeps it well under that threshold. Runs on GitHub's free Actions
# minutes (unlimited for public repos) - no third-party account needed.
#
# Note: GitHub auto-disables scheduled workflows after 60 days with no
# commits to the repo's default branch. If that happens, just re-enable it
# from the Actions tab (or push any commit) to resume.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app health endpoint
        run: curl -sf --max-time 20 https://pocketdoctor-bt87.onrender.com/_stcore/health || curl -sf --max-time 20 https://pocketdoctor-bt87.onrender.com/
